<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff5f2" />
    <meta name="description" content="Explora el campus de la USFQ en un mapa 3D ilustrado. Busca edificios y aulas, consulta fuentes y sigue la ruta a pie con GPS." />
    <link rel="preload" as="image" href="/mascota/gaston/saludando.webp" fetchpriority="high" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/paytone-one-latin-400-normal.woff2" crossorigin />
    <link rel="icon" type="image/png" href="/mascota/gaston/favicon.png" />
    <link rel="apple-touch-icon" href="/mascota/gaston/apple-touch-icon.png" />
    <title>USFQ Explora · Campus en 3D</title>
    <!-- The splash lives here, not in React, so it shows while the app downloads and while the 3D campus is built. -->
    <style>
      @font-face {
        font-family: 'Paytone One';
        font-style: normal;
        font-display: swap;
        font-weight: 400;
        src: url(/fonts/paytone-one-latin-400-normal.woff2) format('woff2');
      }
      html, body { margin: 0; background: #fff5f2; }
      .splash { position: fixed; inset: 0; z-index: 100; overflow: hidden; background: #fff5f2; transition: opacity 0.45s ease, visibility 0.45s; }
      .splash.leaving { opacity: 0; visibility: hidden; pointer-events: none; }
      .splash-brand, .splash-mascot { opacity: 0; transition: opacity 0.25s ease; }
      .splash.shown .splash-brand, .splash.shown .splash-mascot { opacity: 1; }
      .splash-brand { position: absolute; top: 20%; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 22px; }
      .wordmark { margin: 0; font: 36px/1 'Paytone One', system-ui, sans-serif; letter-spacing: -0.02em; color: #1d1b26; }
      .wordmark span { color: #c8102e; }
      .splash-bar { width: 120px; height: 6px; overflow: hidden; border-radius: 999px; background: #f5d6dc; }
      .splash-bar span { display: block; width: 40%; height: 100%; border-radius: 999px; background: #c8102e; animation: splash-bar 1.3s ease-in-out infinite; }
      .splash-mascot { position: absolute; left: 50%; bottom: -7%; width: min(360px, 82vw); height: auto; transform-origin: 50% 100%; animation: splash-float 2.6s ease-in-out infinite; }
      .splash .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      @keyframes splash-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes splash-float { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -10px); } }
      @media (prefers-reduced-motion: reduce) { .splash-mascot, .splash-bar span { animation: none; } .splash, .splash-brand, .splash-mascot { transition: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" class="splash" role="status" aria-live="polite">
      <div class="splash-brand">
        <p class="wordmark">USFQ <span>Explora</span></p>
        <span class="splash-bar" aria-hidden="true"><span></span></span>
        <span class="visually-hidden">Cargando el campus…</span>
      </div>
      <img class="splash-mascot" src="/mascota/gaston/saludando.webp" width="640" height="853" alt="" />
    </div>
    <script>
      // Title and mascot appear together, once both the image and the title font are in; never later than 3 s.
      (function () {
        var splash = document.getElementById('splash')
        var show = function () { splash.classList.add('shown') }
        var mascot = splash.querySelector('img')
        Promise.all([mascot.decode().catch(function () {}), document.fonts.load("36px 'Paytone One'").catch(function () {})]).then(show)
        setTimeout(show, 3000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
